<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chroma AI</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #1a1a1a;
    --surface:   #242424;
    --surface2:  #2e2e2e;
    --border:    #3a3a3a;
    --accent:    #7b68ee;
    --accent-h:  #9b8fff;
    --text:      #f0f0f0;
    --text-muted:#888;
    --success:   #4caf82;
    --error:     #e05c5c;
    --radius:    10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    font-size: 13px;
    height: 560px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--accent), #e88bff);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .header-title { font-weight: 600; font-size: 14px; flex: 1; }
  .selection-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 9px;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .selection-badge:hover { border-color: var(--accent); color: var(--text); }

  /* ── Chat area ── */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 4px; }
  .chat::-webkit-scrollbar-track { background: transparent; }
  .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    max-width: 88%;
    padding: 9px 12px;
    border-radius: var(--radius);
    line-height: 1.5;
    font-size: 12.5px;
  }
  .msg.system {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    max-width: 100%;
    text-align: center;
    font-size: 11.5px;
    padding: 6px 12px;
  }
  .msg.user {
    background: var(--accent);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 3px;
  }
  .msg.ai {
    background: var(--surface2);
    border: 1px solid var(--border);
    align-self: flex-start;
    border-bottom-left-radius: 3px;
  }
  .msg.ai .palette-name {
    font-weight: 600;
    color: var(--accent-h);
    margin-bottom: 4px;
  }
  .msg.ai .rationale { color: var(--text-muted); font-size: 11.5px; margin-top: 4px; }

  .color-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 8px;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 7px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .chip-swatch {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .apply-btn {
    margin-top: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    width: 100%;
  }
  .apply-btn:hover { background: var(--accent-h); }
  .apply-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

  .typing {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    align-self: flex-start;
    border-bottom-left-radius: 3px;
  }
  .typing span {
    width: 6px; height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30%           { transform: translateY(-4px); }
  }

  /* ── Settings area ── */
  .settings {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .settings input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    padding: 6px 10px;
    font-size: 11px;
    outline: none;
    transition: border-color 0.15s;
  }
  .settings input:focus { border-color: var(--accent); }
  .settings input::placeholder { color: var(--text-muted); }

  /* ── Input bar ── */
  .input-bar {
    padding: 10px 16px 14px;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .input-bar textarea {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    padding: 9px 12px;
    font-size: 13px;
    font-family: inherit;
    resize: none;
    outline: none;
    line-height: 1.4;
    min-height: 42px;
    max-height: 90px;
    transition: border-color 0.15s;
  }
  .input-bar textarea:focus { border-color: var(--accent); }
  .input-bar textarea::placeholder { color: var(--text-muted); }
  .send-btn {
    width: 38px; height: 38px;
    background: var(--accent);
    border: none;
    border-radius: 9px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
    align-self: flex-end;
  }
  .send-btn:hover { background: var(--accent-h); }
  .send-btn:disabled { background: var(--border); cursor: not-allowed; }
  .send-btn svg { fill: #fff; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">🎨</div>
  <span class="header-title">Chroma AI</span>
  <span class="selection-badge" id="selBadge" title="Click to refresh">0 selected</span>
</div>

<div class="chat" id="chat"></div>

<div class="settings">
  <input type="text" id="serverUrl" placeholder="MCP server URL (e.g. http://localhost:3000/sse)" />
</div>

<div class="input-bar">
  <textarea id="intentInput" rows="1" placeholder="Describe the palette — mood, brand, style…"></textarea>
  <button class="send-btn" id="sendBtn" disabled title="Send">
    <svg width="16" height="16" viewBox="0 0 16 16">
      <path d="M2 13.5L14 8 2 2.5v4.25l7.5 1.25L2 9.25z"/>
    </svg>
  </button>
</div>

<script>
  const chat       = document.getElementById("chat");
  const selBadge   = document.getElementById("selBadge");
  const intentInput = document.getElementById("intentInput");
  const sendBtn    = document.getElementById("sendBtn");
  const serverUrl  = document.getElementById("serverUrl");

  let elements = [];
  let pendingAnalysis = null;

  // ── Persist server URL ──────────────────────────────────────────────────────
  const STORAGE_KEY = "chroma_ai_server_url";
  serverUrl.value = localStorage.getItem(STORAGE_KEY) || "http://localhost:3000/sse";
  serverUrl.addEventListener("change", () => localStorage.setItem(STORAGE_KEY, serverUrl.value));

  // ── Chat helpers ────────────────────────────────────────────────────────────
  function addMsg(type, html) {
    const div = document.createElement("div");
    div.className = `msg ${type}`;
    div.innerHTML = html;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function toHex(c) {
    const v = Math.round(c * 255).toString(16).padStart(2, "0");
    return v;
  }

  function colorToHex({ r, g, b }) {
    return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
  }

  // ── Send to connector ───────────────────────────────────────────────────────
  async function analyze(intent) {
    // Strip /sse suffix if the user pasted the full MCP URL
    const base = (serverUrl.value || "http://localhost:3000/sse")
      .replace(/\/sse\/?$/, "")
      .replace(/\/$/, "");

    const typing = addTyping();
    sendBtn.disabled = true;

    try {
      const res = await fetch(`${base}/invoke`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ elements, intent }),
      });

      typing.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        addMsg("ai", `<span style="color:var(--error)">Error: ${err.error || res.statusText}</span>`);
        return;
      }

      const data = await res.json();
      pendingAnalysis = data;

      const chips = data.assignments
        .filter(a => a.fill)
        .map(a => {
          const hex = colorToHex(a.fill);
          return `<div class="chip">
            <div class="chip-swatch" style="background:${hex}"></div>
            <span>${a.nodeName.slice(0, 18)}</span>
          </div>`;
        }).join("");

      const aiHtml = `
        <div class="palette-name">✦ ${data.palette_name}</div>
        <div>${data.rationale}</div>
        <div class="color-chips">${chips}</div>
        <button class="apply-btn" id="applyBtn">Apply to canvas</button>
      `;
      const aiMsg = addMsg("ai", aiHtml);
      aiMsg.querySelector("#applyBtn").addEventListener("click", applyColors);

    } catch (e) {
      typing.remove();
      addMsg("ai", `<span style="color:var(--error)">Could not reach connector: ${e.message}. Check the URL above.</span>`);
    } finally {
      sendBtn.disabled = elements.length === 0;
    }
  }

  function applyColors() {
    if (!pendingAnalysis) return;
    document.querySelectorAll(".apply-btn").forEach(b => {
      b.disabled = true;
      b.textContent = "Applying…";
    });
    parent.postMessage({
      pluginMessage: {
        type: "APPLY_COLORS",
        assignments: pendingAnalysis.assignments,
        paletteName: pendingAnalysis.palette_name,
      }
    }, "*");
  }

  // ── Input handling ──────────────────────────────────────────────────────────
  intentInput.addEventListener("input", () => {
    sendBtn.disabled = elements.length === 0 || intentInput.value.trim() === "";
    intentInput.style.height = "auto";
    intentInput.style.height = Math.min(intentInput.scrollHeight, 90) + "px";
  });

  intentInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendBtn.click();
    }
  });

  sendBtn.addEventListener("click", () => {
    const intent = intentInput.value.trim();
    if (!intent || elements.length === 0) return;
    addMsg("user", intent);
    intentInput.value = "";
    intentInput.style.height = "auto";
    sendBtn.disabled = true;
    analyze(intent);
  });

  selBadge.addEventListener("click", () => {
    parent.postMessage({ pluginMessage: { type: "REFRESH_SELECTION" } }, "*");
  });

  // ── Messages from code.js ───────────────────────────────────────────────────
  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === "SELECTION") {
      elements = msg.elements;
      selBadge.textContent = `${msg.count} selected`;
      sendBtn.disabled = intentInput.value.trim() === "" || msg.count === 0;

      if (msg.count === 0) {
        addMsg("system", "Select elements on the canvas to get started.");
      } else {
        addMsg("system", `${msg.count} element(s) selected (${msg.elements.length} nodes including children).`);
      }
    }

    if (msg.type === "APPLY_DONE") {
      document.querySelectorAll(".apply-btn").forEach(b => {
        b.disabled = true;
        b.textContent = `✓ Applied to ${msg.count} node(s)`;
        b.style.background = "var(--success)";
      });
      pendingAnalysis = null;
    }
  };

  // ── Boot ────────────────────────────────────────────────────────────────────
  addMsg("system", "Select elements, then describe the palette you want.");
  parent.postMessage({ pluginMessage: { type: "READY" } }, "*");
</script>
</body>
</html>
